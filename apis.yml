name: Handshake
description: >-
  Handshake (joinhandshake.com) is the early-career talent network that connects
  students and recent graduates with employers, alongside the higher-education Career
  Services teams that support them. For developers and institutional integrators,
  Handshake exposes the EDU API: a read-only, institution-scoped, versioned API for
  career-services data management and automation, covering applications, appointments,
  career fairs, jobs, postings, qualifications, and meetings. The EDU API is currently
  in beta and gated to Career Services partners, authenticates with an x-api-key header
  issued from the Developer Portal, and supports pagination, sorting, and delta
  fetching. Handshake was originally added to the API Evangelist network as a VC
  portfolio lead and has since been enriched from its public developer documentation,
  trust center, and status surfaces.
